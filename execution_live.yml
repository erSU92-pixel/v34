name: XAUUSD APEX V38 LIVE

on:
  schedule:
    # Setiap 15 menit (idempotent; dedup by bar_ts)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Trading mode'
        type: choice
        options: ['paper', 'oanda-practice', 'oanda-live']
        default: 'paper'
      dry_run:
        description: 'Dry run (no orders)?'
        type: choice
        options: ['true', 'false']
        default: 'false'

permissions:
  contents: read

concurrency:
  group: v38-live
  cancel-in-progress: false

jobs:
  execute:
    name: V38 Live Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute engine
        env:
          TRADING_MODE: ${{ github.event.inputs.mode || 'paper' }}
          CONFIRM_LIVE: ${{ secrets.CONFIRM_LIVE }}          # = I_UNDERSTAND_THE_RISK untuk live
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          MAX_RISK_PER_TRADE: '0.01'
          MAX_DRAWDOWN_KILL: '0.10'
          MAX_DAILY_LOSS_KILL: '0.03'
          MIN_CONFIDENCE: '0.55'
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          python xauusd_apex_v38_live.py $ARGS

      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v38-state-${{ github.run_id }}
          path: |
            state/xauusd_v38_state.json
          if-no-files-found: warn
          retention-days: 7
