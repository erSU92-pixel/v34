name: APEX PREDATOR v20.0 — Unified Quant Engine
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode Eksekusi APEX'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto         # Otomatis: LIVE jika APEX_LIVE_ENABLED == true, selain itu DRY-RUN
          - live         # Paksa kirim sinyal real LIVE ke Telegram
          - dry_run      # Simulasi full pipeline tanpa sinyal live
          - smoke_test   # Uji fetch data TwelveData & Parliament Voting
          - test_tg      # Uji koneksi & kirim pesan bot Telegram
          - selftest     # Uji parameter matematika & konfigurasi saja
  push:
    branches: [main, master]
    paths:
      - 'apex_v19_production.py'
      - '.github/workflows/apex_v19.yml'

permissions:
  contents: read

concurrency:
  group: apex-engine-single
  cancel-in-progress: false

jobs:
  apex-engine:
    name: 🏛️ APEX — ${{ github.event_name == 'schedule' && 'Scheduled 15m' || github.event_name == 'push' && 'Push CI' || github.event.inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📚 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            "numpy>=1.24,<3" \
            "pandas>=2.0,<3" \
            "requests>=2.31"

      - name: 🧪 Invariant Selftest
        run: python apex_v19_production.py selftest

      - name: 🔎 Test Telegram Connection
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test_tg'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APEX_DRY_RUN: 'false'
        run: python apex_v19_production.py test-tg

      - name: 💨 Smoke Test — Fetch Data & Consensus
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'smoke_test')
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          APEX_DRY_RUN: 'true'
        run: python apex_v19_production.py smoke

      - name: 🚀 Core Execution Pipeline
        if: |
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && contains(fromJSON('["auto", "live", "dry_run"]'), github.event.inputs.mode))
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          APEX_DRY_RUN: >-
            ${{
              (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'live') && 'false' ||
              (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'dry_run') && 'true' ||
              (vars.APEX_LIVE_ENABLED == 'true') && 'false' ||
              'true'
            }}
          APEX_SYMBOL: 'XAUUSD'
          APEX_ACCOUNT_BALANCE: '1000'
          APEX_MAX_RISK_PCT_PER_TRADE: '1.0'
          APEX_MAX_DAILY_LOSS_PCT: '3.0'
          APEX_MAX_CONSECUTIVE_LOSSES: '3'
          APEX_MAX_DAILY_SIGNALS: '5'
          APEX_NEWS_BLACKOUT_MIN: '30'
          APEX_KILL_SWITCH: 'false'
        run: python apex_v19_production.py run

      - name: 📋 Upload State Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-state-${{ github.run_number }}
          path: apex_state_v19.json
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧾 Step Summary
        if: always()
        run: |
          {
            echo "### 🏛️ APEX v20.0 — Execution Summary"
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Mode / Input | \`${{ github.event.inputs.mode || 'Automatic' }}\` |"
            echo "| Job Status | ${{ job.status }} |"
            echo "| Engine Version | \`v20.0-institutional-unified\` |"
            echo "| Timestamp | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |"
          } >> $GITHUB_STEP_SUMMARY
