name: Institutional 18-Pillar Engine

on:
  schedule:
    # Sun–Fri; market-hours filter ada di Python (is_market_open)
    - cron: '*/15 * * * 0-5'
  workflow_dispatch:

concurrency:
  group: institutional-engine-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Engine & Telegram Dispatcher
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python bot.py

      - name: Notify on Failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="🚨 Workflow FAILED at $(date -u '+%Y-%m-%d %H:%M:%S UTC')%0ARepo: ${{ github.repository }}%0ARun: ${{ github.run_id }}"
          fi

      - name: Safe Sync, Commit, and Push State
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          if ! git pull origin main --rebase --autostash; then
            git rebase --abort 2>/dev/null || true
            echo "::error::Rebase conflict — aborting to avoid corrupt state"
            exit 1
          fi

          FILES=""
          [ -f signal_state.json ]       && FILES="$FILES signal_state.json"
          [ -f xauusd_apex_report.json ] && FILES="$FILES xauusd_apex_report.json"

          if [ -n "$FILES" ]; then
            git add $FILES
            git commit -m "chore: update engine state [skip ci]" || echo "No changes to commit"
            git push origin main
          else
            echo "No state files to commit"
          fi
