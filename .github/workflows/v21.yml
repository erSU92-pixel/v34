name: APEX v21 One-Click

on:
  workflow_dispatch:  # Tombol manual
  schedule:
    - cron: '*/30 * * * 1-5' # Otomatis Senin-Jumat setiap 30 menit
    - cron: '0 0 * * 1'      # Validasi otomatis setiap Senin pagi

permissions:
  contents: read

concurrency:
  group: apex-predator-v21
  cancel-in-progress: false

jobs:
  apex-run-all:
    name: APEX All-In-One Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir "numpy>=1.24,<3" "pandas>=2.0,<3" "requests>=2.31" "scikit-learn>=1.3" "scipy>=1.11"

      - name: 1️⃣ Selftest
        env:
          APEX_DRY_RUN: 'true'
          APEX_REQUIRE_STATE_PERSISTENCE: 'false'
        run: python apex_v21.py selftest

      # Validasi otomatis jalan saat Anda klik tombol, atau hari Senin
      - name: 2️⃣ Edge Validation (Walk-Forward)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * 1'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          OANDA_API_KEY:       ${{ secrets.OANDA_API_KEY }}
          APEX_DRY_RUN: 'true'
          APEX_REQUIRE_STATE_PERSISTENCE: 'false'
        run: python apex_v21.py validate

      - name: 3️⃣ Test Telegram
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APEX_DRY_RUN:     'false'
        run: python apex_v21.py test-tg

      - name: 4️⃣ Run Bot (Live/Dry based on Repo Variables)
        env:
          GIST_ID:              ${{ secrets.GIST_ID }}
          GIST_TOKEN:           ${{ secrets.GIST_TOKEN }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_KEY:        ${{ secrets.OANDA_API_KEY }}
          TWELVE_DATA_API_KEY:  ${{ secrets.TWELVE_DATA_API_KEY }}

          # MEMBACA DARI VARIABLES GITHUB (Bukan di-hardcode)
          APEX_LIVE_ENABLED: ${{ vars.APEX_LIVE_ENABLED }}
          APEX_KILL_SWITCH: ${{ vars.APEX_KILL_SWITCH || 'false' }}
          
          # Jika APEX_LIVE_ENABLED = 'true', maka DRY_RUN = 'false' (LIVE)
          APEX_DRY_RUN: ${{ vars.APEX_LIVE_ENABLED == 'true' && 'false' || 'true' }}
          
          APEX_REQUIRE_STATE_PERSISTENCE: 'true'
          APEX_SYMBOL: 'XAUUSD'
          APEX_ACCOUNT_BALANCE: '1000'
          APEX_MAX_RISK_PCT_PER_TRADE: '0.5'
        run: python apex_v21.py run
