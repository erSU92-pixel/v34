name: XAUUSD Bot

on:
  schedule:
    - cron: "5 * * * *"   # tiap jam
  workflow_dispatch:
    inputs:
      mode:
        description: "1=live signal, 0=backtest"
        required: false
        default: "1"
        type: choice
        options: ["1", "0"]
      strategy:
        description: "Strategy"
        required: false
        default: "mean_rev"
        type: choice
        options: ["mean_rev", "trend", "breakout"]

concurrency:
  group: xauusd-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install numpy pandas requests

      - name: Run Bot
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}

          SYMBOL: "XAU/USD"
          TF: "4h"
          OUTPUT_SIZE: "1000"
          STRATEGY: ${{ github.event.inputs.strategy || 'trend' }}

          ACCOUNT_BALANCE: "10000"
          RISK_PCT: "0.003"

          # Mode: 1=live (kirim sinyal), 0=backtest (test historis)
          LIVE_MODE: ${{ github.event.inputs.mode || '1' }}
          BACKTEST_MODE: ${{ github.event.inputs.mode == '0' && '1' || '0' }}
          BACKTEST_DAYS: "90"
          NOTIFY_HOLD: "0"
        run: python xauusd_bot.py
