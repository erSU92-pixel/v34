name: APEX PREDATOR v21.0

on:
  # [v21] Cron dipisah — signal check setiap 15 menit, tapi skip kalau diluar killzone
  # Bot sendiri sudah filter killzone, jadi cron tetap 15 menit
  schedule:
    - cron: '*/15 * * * *'
    # [v21] Weekly validation — Senin 00:00 UTC
    - cron: '0 0 * * 1'

  workflow_dispatch:
    inputs:
      stage:
        description: 'Pilih tahap testing'
        required: true
        default: 'smoke_only'
        type: choice
        options:
          - full_validation
          - live_promote
          - smoke_only
          - selftest_only
          - validate_edge        # [v21] walk-forward backtest
          - cb_status            # [v21] circuit breaker diagnostic
      # [v21] Optional: matikan filter tertentu untuk A/B testing
      disable_filters:
        description: 'Filter yang dimatikan (comma-separated, e.g. "dxy,mtf,orb")'
        required: false
        default: ''
        type: string

  push:
    branches: [main, master]
    paths:
      - 'apex_v21.py'
      - '.github/workflows/apex.yml'

permissions:
  contents: read

concurrency:
  group: apex-predator-v21
  cancel-in-progress: false

# ════════════════════════════════════════════════════════════
# REUSABLE: dependency install steps
# ════════════════════════════════════════════════════════════
env:
  PYTHON_VERSION: '3.11'
  # [v21] Global env vars (bisa di-override per job)
  APEX_SYMBOL: 'XAUUSD'
  APEX_ACCOUNT_BALANCE: '1000'
  APEX_MIN_BALANCE_FOR_TRADING: '200'
  APEX_MAX_RISK_PCT_PER_TRADE: '1.0'
  APEX_MAX_DAILY_LOSS_PCT: '3.0'
  APEX_MAX_CONSECUTIVE_LOSSES: '3'
  APEX_MAX_DAILY_SIGNALS: '5'
  APEX_NEWS_BLACKOUT_MIN: '30'
  APEX_ENABLE_ML_MODELS: 'true'
  APEX_MT5_OFFSET: '0.0'
  APEX_KILL_SWITCH: 'false'
  APEX_EXIT_MODEL: 'single_tp'

jobs:
  # ════════════════════════════════════════════════════════
  # JOB 1: MANUAL — full/partial pipeline
  # ════════════════════════════════════════════════════════
  apex-manual:
    name: APEX Manual — ${{ github.event.inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            "numpy>=1.24,<3" \
            "pandas>=2.0,<3" \
            "requests>=2.31" \
            "scikit-learn>=1.3" \
            "scipy>=1.11"

      - name: 🔎 Verify imports
        run: |
          python - <<'PY'
          import numpy, pandas, requests, sklearn, scipy
          print("numpy    ", numpy.__version__)
          print("pandas   ", pandas.__version__)
          print("requests ", requests.__version__)
          print("sklearn  ", sklearn.__version__)
          print("scipy    ", scipy.__version__)
          PY

      - name: "1️⃣  Selftest — validasi config"
        if: |
          github.event.inputs.stage == 'full_validation' ||
          github.event.inputs.stage == 'live_promote' ||
          github.event.inputs.stage == 'selftest_only'
        env:
          APEX_DRY_RUN: 'true'
          APEX_REQUIRE_STATE_PERSISTENCE: 'false'   # [v21] selftest tidak butuh gist
        run: |
          echo "::group::selftest"
          python apex_v21.py selftest
          echo "::endgroup::"

      - name: "2️⃣  Test Telegram"
        if: github.event.inputs.stage == 'full_validation'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APEX_DRY_RUN:     'false'
          APEX_REQUIRE_STATE_PERSISTENCE: 'false'
        run: |
          echo "::group::test-tg"
          python apex_v21.py test-tg
          echo "::endgroup::"

      - name: "3️⃣  Smoke — fetch data + parliament + all filters"
        if: |
          github.event.inputs.stage == 'full_validation' ||
          github.event.inputs.stage == 'smoke_only'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          OANDA_API_KEY:       ${{ secrets.OANDA_API_KEY }}
          APEX_DRY_RUN: 'true'
          APEX_REQUIRE_STATE_PERSISTENCE: 'false'
          APEX_SKIP_KILLZONE_FILTER: 'true'
          # [v21] Filter toggles from input
          APEX_DISABLE_FILTERS: ${{ github.event.inputs.disable_filters }}
        run: |
          echo "::group::smoke"
          python apex_v21.py smoke
          echo "::endgroup::"

      # [v21] NEW — walk-forward edge validation
      - name: "4️⃣  Edge Validation — walk-forward backtest"
        if: github.event.inputs.stage == 'validate_edge'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          OANDA_API_KEY:       ${{ secrets.OANDA_API_KEY }}
          APEX_DRY_RUN: 'true'
          APEX_REQUIRE_STATE_PERSISTENCE: 'false'
          APEX_SKIP_KILLZONE_FILTER: 'true'
          APEX_NEWS_BLACKOUT_MIN: '0'
        run: |
          echo "::group::validate"
          python apex_v21.py validate | tee validate_output.txt
          echo "::endgroup::"
          # [v21] Auto-fail if edge negative (act as CI gate)
          if grep -q "EDGE NEGATIVE\|EDGE WEAK" validate_output.txt; then
            echo "::error::❌ Edge NEGATIVE — do NOT trade live"
            exit 1
          fi
          echo "::notice::✅ Edge POSITIVE — safe to proceed to paper trade"

      # [v21] NEW — circuit breaker diagnostic
      - name: "5️⃣  Circuit Breaker Status"
        if: github.event.inputs.stage == 'cb_status'
        env:
          GIST_ID:    ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          APEX_DRY_RUN: 'false'
          APEX_REQUIRE_STATE_PERSISTENCE: 'false'
        run: |
          echo "::group::cb-status"
          python apex_v21.py cb-status
          echo "::endgroup::"

      - name: "6️⃣  Run DRY — full pipeline tanpa kirim sinyal"
        if: github.event.inputs.stage == 'full_validation'
        env:
          GIST_ID:              ${{ secrets.GIST_ID }}
          GIST_TOKEN:           ${{ secrets.GIST_TOKEN }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_KEY:        ${{ secrets.OANDA_API_KEY }}
          TWELVE_DATA_API_KEY:  ${{ secrets.TWELVE_DATA_API_KEY }}
          APEX_DRY_RUN: 'true'
          APEX_REQUIRE_STATE_PERSISTENCE: 'false'
          APEX_SKIP_KILLZONE_FILTER: 'true'
          # [v21] Filter toggles from input
          APEX_DISABLE_FILTERS: ${{ github.event.inputs.disable_filters }}
        run: |
          echo "::group::run (dry)"
          python apex_v21.py run
          echo "::endgroup::"

      - name: "7️⃣  Run LIVE — kirim sinyal nyata"
        if: github.event.inputs.stage == 'live_promote'
        env:
          GIST_ID:              ${{ secrets.GIST_ID }}
          GIST_TOKEN:           ${{ secrets.GIST_TOKEN }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_KEY:        ${{ secrets.OANDA_API_KEY }}
          TWELVE_DATA_API_KEY:  ${{ secrets.TWELVE_DATA_API_KEY }}
          APEX_DRY_RUN: 'false'
          # [v21] Production requires Gist persistence — hard fail kalau kosong
          APEX_REQUIRE_STATE_PERSISTENCE: 'true'
          # [v21] All Tier 1 filters aktif
          APEX_ENABLE_DXY_FILTER:           'true'
          APEX_DXY_REQUIRE_MATCH:           'false'
          APEX_ENABLE_ATR_PERCENTILE:       'true'
          APEX_ENABLE_MTF_ALIGNMENT:        'true'
          APEX_MTF_MIN_SCORE:               '3'
          APEX_ENABLE_KEY_LEVELS:           'true'
          APEX_ENABLE_SESSION_BLACKLIST:    'true'
          APEX_ENABLE_REGIME_ROUTING:       'true'
          APEX_ENABLE_SWEEP_VOTER:          'true'
          APEX_ENABLE_FVG_VOTER:            'true'
          APEX_ENABLE_ADAPTIVE_WEIGHTS:     'true'
          APEX_ENABLE_MOMENTUM_FILTER:      'true'
          APEX_ENABLE_ORB:                  'true'
          APEX_ENABLE_VOLATILITY_SPIKE:     'true'
          # [v21] Optional filter toggles
          APEX_DISABLE_FILTERS: ${{ github.event.inputs.disable_filters }}
        run: |
          echo "::group::run (live)"
          python apex_v21.py run
          echo "::endgroup::"

      - name: 📋 Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-state-${{ github.run_number }}
          path: |
            apex_state_v21.json
            validate_output.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧾 Summary
        if: always()
        run: |
          {
            echo "### APEX v21.0 — Manual Run"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Stage | \`${{ github.event.inputs.stage }}\` |"
            echo "| Filters OFF | \`${{ github.event.inputs.disable_filters }}\` |"
            echo "| Status | ${{ job.status }} |"
            echo "| Time | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |"
          } >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════
  # JOB 2: SCHEDULED — every 15 min
  # ════════════════════════════════════════════════════════
  apex-schedule:
    name: APEX Scheduled Signal Check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            "numpy>=1.24,<3" \
            "pandas>=2.0,<3" \
            "requests>=2.31" \
            "scikit-learn>=1.3" \
            "scipy>=1.11"

      - name: 🧪 Selftest
        env:
          APEX_DRY_RUN: 'true'
          APEX_REQUIRE_STATE_PERSISTENCE: 'false'
        run: python apex_v21.py selftest

      # [v21] Auto-pause if too many runs in current hour (rate-limit safety)
      - name: ⏱️ Rate limit guard
        id: ratecheck
        run: |
          MINUTE=$(date -u +%M)
          HOUR=$(date -u +%H)
          DAY=$(date -u +%u)   # 1=Mon 7=Sun
          # Skip on weekend (bot also filters, but save GH Actions minutes)
          if [ "$DAY" -ge 6 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Weekend — skipping scheduled run"
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: 🚀 Scheduled run
        if: steps.ratecheck.outputs.skip != 'true'
        env:
          GIST_ID:              ${{ secrets.GIST_ID }}
          GIST_TOKEN:           ${{ secrets.GIST_TOKEN }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_KEY:        ${{ secrets.OANDA_API_KEY }}
          TWELVE_DATA_API_KEY:  ${{ secrets.TWELVE_DATA_API_KEY }}

          # [v21] Live toggle via repository variable (Settings → Variables)
          # Set APEX_LIVE_ENABLED=true to go live, unset/false for dry-run
          APEX_DRY_RUN: ${{ vars.APEX_LIVE_ENABLED == 'true' && 'false' || 'true' }}
          APEX_REQUIRE_STATE_PERSISTENCE: 'true'

          # [v21] Kill switch via repository variable — instant halt
          APEX_KILL_SWITCH: ${{ vars.APEX_KILL_SWITCH || 'false' }}

          # [v21] All filters active by default
          APEX_ENABLE_DXY_FILTER:           'true'
          APEX_DXY_REQUIRE_MATCH:           'false'
          APEX_ENABLE_ATR_PERCENTILE:       'true'
          APEX_ENABLE_MTF_ALIGNMENT:        'true'
          APEX_MTF_MIN_SCORE:               '3'
          APEX_ENABLE_KEY_LEVELS:           'true'
          APEX_ENABLE_SESSION_BLACKLIST:    'true'
          APEX_ENABLE_REGIME_ROUTING:       'true'
          APEX_ENABLE_SWEEP_VOTER:          'true'
          APEX_ENABLE_FVG_VOTER:            'true'
          APEX_ENABLE_ADAPTIVE_WEIGHTS:     'true'
          APEX_ENABLE_MOMENTUM_FILTER:      'true'
          APEX_ENABLE_ORB:                  'true'
          APEX_ENABLE_VOLATILITY_SPIKE:     'true'
        run: python apex_v21.py run

      - name: 📋 Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-sched-${{ github.run_number }}
          path: apex_state_v21.json
          retention-days: 3
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════
  # JOB 3: WEEKLY VALIDATION — every Monday 00:00 UTC
  # ════════════════════════════════════════════════════════
  apex-weekly-validate:
    name: Weekly Edge Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            "numpy>=1.24,<3" \
            "pandas>=2.0,<3" \
            "requests>=2.31" \
            "scikit-learn>=1.3" \
            "scipy>=1.11"

      - name: 🔬 Run walk-forward validation
        id: validate
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          OANDA_API_KEY:       ${{ secrets.OANDA_API_KEY }}
          APEX_DRY_RUN: 'true'
          APEX_REQUIRE_STATE_PERSISTENCE: 'false'
          APEX_SKIP_KILLZONE_FILTER: 'true'
          APEX_NEWS_BLACKOUT_MIN: '0'
        run: |
          python apex_v21.py validate | tee weekly_validate.txt
          # Extract expectancy for summary
          EX=$(grep -oP 'Expectancy: [+-]?[0-9.]+R' weekly_validate.txt | grep -oP '[+-]?[0-9.]+' || echo "0")
          echo "expectancy=$EX" >> $GITHUB_OUTPUT

      - name: 🛑 Auto-halt on negative edge
        if: steps.validate.outputs.expectancy < '0.10'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "::error::❌ Weekly expectancy ${{ steps.validate.outputs.expectancy }}R < 0.10R threshold"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=<b>⚠️ WEEKLY VALIDATION ALERT</b>%0A%0AExpectancy: <b>${{ steps.validate.outputs.expectancy }}R</b>%0AThreshold: <b>+0.10R</b>%0A%0A%3Cb%3EAction required:%3C/b%3E Review strategy. Consider setting %3Ccode%3EAPEX_KILL_SWITCH=true%3C/code%3E in repo variables." \
            || true
          exit 1

      - name: ✅ Success notification
        if: steps.validate.outputs.expectancy >= '0.10'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=✅ <b>Weekly Edge Check PASSED</b>%0AExpectancy: <b>+${{ steps.validate.outputs.expectancy }}R</b>" \
            || true

      - name: 📋 Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-validate-${{ github.run_number }}
          path: weekly_validate.txt
          retention-days: 30

      - name: 🧾 Summary
        if: always()
        run: |
          {
            echo "### APEX v21.0 — Weekly Validation"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Expectancy | \`${{ steps.validate.outputs.expectancy }}R\` |"
            echo "| Threshold | \`+0.10R\` |"
            echo "| Verdict | ${{ steps.validate.outputs.expectancy >= '0.10' && '✅ PASS' || '❌ FAIL' }} |"
            echo "| Time | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |"
          } >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════
  # JOB 4: VALIDATE ON PUSH
  # ════════════════════════════════════════════════════════
  validate-on-push:
    name: Validate on Push
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            "numpy>=1.24,<3" \
            "pandas>=2.0,<3" \
            "requests>=2.31" \
            "scikit-learn>=1.3" \
            "scipy>=1.11"

      - name: 🧪 Selftest
        env:
          APEX_DRY_RUN: 'true'
          APEX_REQUIRE_STATE_PERSISTENCE: 'false'
        run: python apex_v21.py selftest

      - name: 💨 Smoke test
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          OANDA_API_KEY:       ${{ secrets.OANDA_API_KEY }}
          APEX_DRY_RUN: 'true'
          APEX_REQUIRE_STATE_PERSISTENCE: 'false'
          APEX_SKIP_KILLZONE_FILTER: 'true'
        run: python apex_v21.py smoke

      - name: 🔬 Quick edge validation
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          OANDA_API_KEY:       ${{ secrets.OANDA_API_KEY }}
          APEX_DRY_RUN: 'true'
          APEX_REQUIRE_STATE_PERSISTENCE: 'false'
          APEX_SKIP_KILLZONE_FILTER: 'true'
          APEX_NEWS_BLACKOUT_MIN: '0'
        run: python apex_v21.py validate
