name: Apex Hybrid v6.0 Engine

on:
  schedule:
    # Live Trading (Senin-Jumat, tiap 15 menit)
    - cron: '*/15 * * * 1-5'
    # Backtest Mingguan (Sabtu jam 08:00 UTC)
    - cron: '0 8 * * 6'
  workflow_dispatch: # Tombol manual

concurrency:
  group: institutional-engine-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
          
      - name: Install Dependencies
        run: |
          pip install requests numpy pandas yfinance

      - name: Run Live Engine (Every 15m)
        if: github.event.schedule != '0 8 * * 6'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE }}
          RISK_PERCENT: ${{ secrets.RISK_PERCENT }}
        run: python botmain.py

      - name: Run Weekly Backtest (Saturday)
        if: github.event.schedule == '0 8 * * 6'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_BACKTEST: "true"
        run: python botmain.py

      - name: Safe Sync State
        if: github.event.schedule != '0 8 * * 6'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          if ! git pull origin main --rebase --autostash; then git rebase --abort; exit 1; fi
          
          FILES=""
          [ -f signal_state.json ] && FILES="$FILES signal_state.json"
          [ -f xauusd_apex_report.json ] && FILES="$FILES xauusd_apex_report.json"
          
          if [ -n "$FILES" ]; then
            git add $FILES
            git commit -m "chore: update state v6 [skip ci]" || echo "No changes"
            git push origin main
          fi
