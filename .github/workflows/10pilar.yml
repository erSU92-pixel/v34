name: XAUUSD Voting Bot

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "1=live signal, 0=backtest"
        required: false
        default: "1"
        type: choice
        options: ["1", "0"]
      tf:
        description: "Timeframe"
        required: false
        default: "1h"
        type: choice
        options: ["1h", "4h"]
      threshold:
        description: "Voting threshold"
        required: false
        default: "4.0"
        type: choice
        options: ["2.5", "3.0", "3.5", "4.0", "5.0"]

concurrency:
  group: xauusd-voting
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install numpy pandas requests

      - name: Run Voting Bot
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}

          SYMBOL: "XAU/USD"
          TF: ${{ github.event.inputs.tf || '1h' }}
          OUTPUT_SIZE: "5000"
          THRESHOLD: ${{ github.event.inputs.threshold || '4.0' }}

          ACCOUNT_BALANCE: "10000"
          RISK_PCT: "0.003"

          LIVE_MODE: ${{ github.event.inputs.mode == '0' && '0' || '1' }}
          BACKTEST_MODE: ${{ github.event.inputs.mode == '0' && '1' || '0' }}
          BACKTEST_DAYS: "90"
          NOTIFY_HOLD: "0"
        run: python xauusd_voting_bot.py
