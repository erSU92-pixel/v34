name: XAUUSD APEX V36

on:
  schedule:
    - cron: '5 */4 * * *'
  workflow_dispatch:
    inputs:
      allow_synthetic:
        description: 'Gunakan data sintetis?'
        type: choice
        options: ['false', 'true']
        default: 'false'
      ablation:
        description: 'Ablation mode'
        type: choice
        options: ['none', 'random', 'no_filter', 'random_no_filter']
        default: 'none'
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: v36-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    name: V36 Quant Engine
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: |
          python - <<'PYEOF'
          import sklearn, scipy, yfinance, websockets, requests, pandas, numpy
          print("core imports OK")
          try:
              import dukascopy_python
              print("dukascopy-python OK")
          except ImportError as e:
              print(f"dukascopy MISSING: {e}")
          PYEOF

      - name: Download data
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python download_data.py

      - name: Execute engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALLOW_SYNTHETIC: ${{ github.event.inputs.allow_synthetic || 'false' }}
          ABLATION: ${{ github.event.inputs.ablation || 'none' }}
        run: |
          ARGS="--data data/xauusd_h1.csv --ablation ${ABLATION}"
          [ "${ALLOW_SYNTHETIC}" = "true" ] && ARGS="$ARGS --allow-synthetic"
          python xauusd_apex_v36_fixed.py $ARGS

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-report-${{ github.run_id }}-${{ github.event.inputs.ablation || 'none' }}
          path: |
            V36_QUANT_EXECUTION_REPORT.json
            V36_QUANT_EXECUTION_REPORT_*.json
          if-no-files-found: error
          retention-days: 30
