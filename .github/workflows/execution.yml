name: XAUUSD APEX V36

on:
  workflow_dispatch:
    inputs:
      allow_synthetic:
        description: 'Gunakan data sintetis?'
        type: choice
        options: ['false', 'true']
        default: 'false'
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  execute:
    name: V36 Quant Engine
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Multi-Source Data
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          cat << 'EOF' > download_data.py
          import os, sys, json, asyncio, requests
          import pandas as pd
          import yfinance as yf
          import websockets

          MIN_REQUIRED_BARS = 2000

          def format_df(df, source_name):
              if len(df) < MIN_REQUIRED_BARS:
                  raise ValueError(f"Data dari {source_name} terlalu sedikit ({len(df)} baris).")
              df = df.sort_values('timestamp').reset_index(drop=True)
              os.makedirs('data', exist_ok=True)
              df.to_csv('data/xauusd_m5.csv', index=False)
              print(f"[SUKSES] Sumber data digunakan: {source_name} ({len(df)} baris)")

          def get_twelve_data():
              api_key = os.environ.get('TWELVEDATA_API_KEY')
              if not api_key: raise ValueError("API Key Twelve Data kosong")
              print("[1/3] Mencoba Twelve Data...")
              url = f'https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=1h&outputsize=5000&apikey={api_key}'
              r = requests.get(url, timeout=15).json()
              if 'values' not in r: raise ValueError(f"Error Twelve Data: {r}")
              df = pd.DataFrame(r['values'])
              df['timestamp'] = pd.to_datetime(df['datetime'], utc=True)
              for col in ['open', 'high', 'low', 'close', 'volume']:
                  df[col] = pd.to_numeric(df[col], errors='coerce')
              df = df[['timestamp', 'open', 'high', 'low', 'close', 'volume']].iloc[::-1]
              format_df(df, "Twelve Data")

          async def fetch_deriv():
              url = 'wss://api.derivws.com/trading/v1/options/ws/public'
              async with websockets.connect(url) as ws:
                  req = {'ticks_history': 'frxXAUUSD', 'style': 'candles', 'granularity': 3600, 'count': 5000, 'end': 'latest', 'req_id': 1}
                  await ws.send(json.dumps(req))
                  data = json.loads(await ws.recv())
                  if 'candles' not in data: raise ValueError(f"Error Deriv: {data}")
                  df = pd.DataFrame(data['candles'])
                  df['timestamp'] = pd.to_datetime(df['epoch'], unit='s', utc=True)
                  df['volume'] = 0
                  df = df[['timestamp', 'open', 'high', 'low', 'close', 'volume']]
                  format_df(df, "Deriv API")

          def get_deriv_data():
              print("[2/3] Mencoba Deriv API...")
              asyncio.run(fetch_deriv())

          def get_yahoo_data():
              print("[3/3] Mencoba Yahoo Finance...")
              df = yf.download('GC=F', period='2y', interval='1h', progress=False)
              if df.empty: raise ValueError("Error Yahoo Finance: Data kosong")
              if isinstance(df.columns, pd.MultiIndex): df.columns = df.columns.get_level_values(0)
              df = df.reset_index()
              df.columns = [str(c).lower() for c in df.columns]
              if 'datetime' in df.columns: df = df.rename(columns={'datetime': 'timestamp'})
              elif 'date' in df.columns: df = df.rename(columns={'date': 'timestamp'})
              df = df[['timestamp', 'open', 'high', 'low', 'close', 'volume']]
              df['timestamp'] = pd.to_datetime(df['timestamp'], utc=True)
              
              try:
                  print("   -> Menghitung Offset Harga (Futures vs Spot)...")
                  spot = yf.download('XAUUSD=X', period='1d', interval='1m', progress=False)
                  if not spot.empty:
                      offset = spot['Close'].iloc[-1] - df['close'].iloc[-1]
                      print(f"   -> Offset terdeteksi: {offset:.2f} USD")
                      df['open'] += offset; df['high'] += offset; df['low'] += offset; df['close'] += offset
              except Exception as e: print(f"   -> Offset gagal: {e}")
              format_df(df, "Yahoo Finance (Offset Adjusted)")

          try: get_twelve_data()
          except Exception as e:
              print(f"[-] Twelve Data gagal: {e}")
              try: get_deriv_data()
              except Exception as e:
                  print(f"[-] Deriv gagal: {e}")
                  try: get_yahoo_data()
                  except Exception as e:
                      print(f"[-] Yahoo gagal: {e}")
                      sys.exit("SEMUA SUMBER DATA GAGAL ATAU DATA TERLALU SEDIKIT.")
          EOF
          python download_data.py

      - name: Execute engine
        env:
          ALLOW_SYNTHETIC: ${{ github.event.inputs.allow_synthetic || 'false' }}
        run: |
          if [ "${ALLOW_SYNTHETIC}" = "true" ]; then
            python xauusd_apex_v36.py --data data/xauusd_m5.csv --allow-synthetic
          else
            python xauusd_apex_v36.py --data data/xauusd_m5.csv
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-report-${{ github.run_id }}
          path: V36_QUANT_EXECUTION_REPORT.json
          if-no-files-found: warn
