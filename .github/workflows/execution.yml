name: XAUUSD APEX V36

on:
  schedule:
    - cron: '5 */4 * * *'
  workflow_dispatch:
    inputs:
      allow_synthetic:
        description: 'Gunakan data sintetis?'
        type: choice
        options: ['false', 'true']
        default: 'false'
      ablation:
        description: 'Ablation mode'
        type: choice
        options: ['none', 'random', 'no_filter', 'random_no_filter']
        default: 'none'
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: v36-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    name: V36 Quant Engine
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: |
          python - <<'EOF'
          import sklearn, scipy, yfinance, websockets, requests, pandas, numpy
          print("imports OK")
          EOF

      - name: Download Multi-Source Data
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          cat << 'EOF' > download_data.py
          import os, sys, json, asyncio, requests
          import pandas as pd
          import yfinance as yf
          import websockets

          MIN_REQUIRED_BARS = 2000
          MAX_STALENESS    = pd.Timedelta(hours=6)
          OUT_PATH         = 'data/xauusd_h1.csv'

          def format_df(df, source_name):
              if len(df) < MIN_REQUIRED_BARS:
                  raise ValueError(f"{source_name}: too few bars ({len(df)}).")
              df = df.sort_values('timestamp').reset_index(drop=True)
              last = df['timestamp'].iloc[-1]
              age = pd.Timestamp.now(tz='UTC') - last
              if age > MAX_STALENESS:
                  raise ValueError(f"{source_name}: stale last={last} age={age}.")
              os.makedirs('data', exist_ok=True)
              df.to_csv(OUT_PATH, index=False)
              with open('data/source.txt', 'w') as f:
                  f.write(source_name)
              print(f"[SUKSES] {source_name}: {len(df)} bars, last={last}")

          def get_twelve_data():
              key = os.environ.get('TWELVEDATA_API_KEY')
              if not key: raise ValueError("no API key")
              print("[1/3] Twelve Data...")
              url = (f'https://api.twelvedata.com/time_series'
                     f'?symbol=XAU/USD&interval=1h&outputsize=5000&apikey={key}')
              r = requests.get(url, timeout=15).json()
              if 'values' not in r: raise ValueError(str(r))
              df = pd.DataFrame(r['values'])
              df['timestamp'] = pd.to_datetime(df['datetime'], utc=True)
              for c in ['open','high','low','close','volume']:
                  df[c] = pd.to_numeric(df[c], errors='coerce')
              df = df[['timestamp','open','high','low','close','volume']].iloc[::-1]
              format_df(df, "Twelve Data XAU/USD 1h")

          async def fetch_deriv():
              url = 'wss://api.derivws.com/trading/v1/options/ws/public'
              async with websockets.connect(url) as ws:
                  await ws.send(json.dumps({
                      'ticks_history': 'frxXAUUSD', 'style': 'candles',
                      'granularity': 3600, 'count': 5000,
                      'end': 'latest', 'req_id': 1,
                  }))
                  data = json.loads(await ws.recv())
                  if 'candles' not in data: raise ValueError(str(data))
                  df = pd.DataFrame(data['candles'])
                  df['timestamp'] = pd.to_datetime(df['epoch'], unit='s', utc=True)
                  df['volume'] = 0
                  df = df[['timestamp','open','high','low','close','volume']]
                  format_df(df, "Deriv frxXAUUSD 1h")

          def get_deriv_data():
              print("[2/3] Deriv API...")
              asyncio.run(fetch_deriv())

          def get_yahoo_data():
              print("[3/3] Yahoo GC=F 1h + offset...")
              df = yf.download('GC=F', period='2y', interval='1h', progress=False)
              if df.empty: raise ValueError("empty")
              if isinstance(df.columns, pd.MultiIndex):
                  df.columns = df.columns.get_level_values(0)
              df = df.reset_index()
              df.columns = [str(c).lower() for c in df.columns]
              if 'datetime' in df.columns: df = df.rename(columns={'datetime':'timestamp'})
              elif 'date' in df.columns:  df = df.rename(columns={'date':'timestamp'})
              df = df[['timestamp','open','high','low','close','volume']]
              df['timestamp'] = pd.to_datetime(df['timestamp'], utc=True)
              try:
                  spot = yf.download('XAUUSD=X', period='1d', interval='1m', progress=False)
                  if not spot.empty:
                      off = float(spot['Close'].iloc[-1]) - float(df['close'].iloc[-1])
                      print(f"   offset={off:.2f} USD")
                      for c in ['open','high','low','close']:
                          df[c] = df[c] + off
              except Exception as e:
                  print(f"   offset failed: {e}")
              format_df(df, "Yahoo GC=F 1h (offset-adjusted)")

          for fn in (get_twelve_data, get_deriv_data, get_yahoo_data):
              try:
                  fn(); break
              except Exception as e:
                  print(f"[-] {fn.__name__} failed: {e}")
          else:
              sys.exit("ALL DATA SOURCES FAILED")
          EOF
          python download_data.py

      - name: Execute engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALLOW_SYNTHETIC: ${{ github.event.inputs.allow_synthetic || 'false' }}
          ABLATION: ${{ github.event.inputs.ablation || 'none' }}
        run: |
          ARGS="--data data/xauusd_h1.csv --ablation ${ABLATION}"
          [ "${ALLOW_SYNTHETIC}" = "true" ] && ARGS="$ARGS --allow-synthetic"
          python xauusd_apex_v36_fixed.py $ARGS

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-report-${{ github.run_id }}-${{ github.event.inputs.ablation || 'none' }}
          path: |
            V36_QUANT_EXECUTION_REPORT.json
            V36_QUANT_EXECUTION_REPORT_*.json
          if-no-files-found: error
          retention-days: 30
