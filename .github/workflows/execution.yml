name: XAUUSD APEX V36 — Quant Execution Engine

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      allow_synthetic:
        description: 'Gunakan data sintetis (TESTING ONLY)'
        type: choice
        options: ['false', 'true']
        default: 'false'
      execution_mode:
        description: 'Mode eksekusi'
        type: choice
        options: ['research', 'shadow', 'live']
        default: 'research'
  push:
    branches: [main, master]
    paths:
      - 'xauusd_apex_v36.py'
      - 'requirements.txt'
      - '.github/workflows/execution.yml'

concurrency:
  group: xauusd-apex-execution
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: '3.11'
  PYTHONUNBUFFERED: '1'

jobs:
  execute:
    name: V36 Quant Engine
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pre-flight file check
        run: |
          MISSING=0
          if [ ! -f xauusd_apex_v36.py ]; then
            echo "::error::xauusd_apex_v36.py NOT FOUND in repo root."
            MISSING=1
          fi
          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt NOT FOUND in repo root."
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Push file yang hilang ke root repo, lalu re-run workflow."
            ls -la
            exit 1
          fi
          echo "All required files present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static syntax check
        run: python -m py_compile xauusd_apex_v36.py

      - name: Governance gate — block live mode
        if: github.event.inputs.execution_mode == 'live'
        run: |
          echo "::error::Live execution mode is NOT yet wired to a broker adapter."
          exit 1

      - name: Governance gate — shadow mode warning
        if: github.event.inputs.execution_mode == 'shadow'
        run: |
          echo "::warning::Shadow mode — no capital at risk."

      - name: Prepare market data
        env:
          DATA_URL: ${{ secrets.DATA_URL }}
          DATA_URL_HEADER_NAME: ${{ secrets.DATA_URL_HEADER_NAME }}
          DATA_URL_HEADER_VALUE: ${{ secrets.DATA_URL_HEADER_VALUE }}
          ALLOW_SYNTHETIC: ${{ github.event.inputs.allow_synthetic || 'false' }}
        run: |
          mkdir -p data
          if [ -n "${DATA_URL:-}" ]; then
            echo "::group::Fetching market data"
            HEADER_ARGS=()
            if [ -n "${DATA_URL_HEADER_NAME:-}" ] && [ -n "${DATA_URL_HEADER_VALUE:-}" ]; then
              HEADER_ARGS=(-H "${DATA_URL_HEADER_NAME}: ${DATA_URL_HEADER_VALUE}")
            fi
            curl -fsSL --retry 3 --retry-delay 5 --max-time 180 \
              "${HEADER_ARGS[@]}" \
              -o data/xauusd_m5.csv "$DATA_URL" || echo "::warning::Data fetch failed."
            echo "::endgroup::"
          fi

          if [ -f data/xauusd_m5.csv ]; then
            ROWS=$(wc -l < data/xauusd_m5.csv)
            echo "Data ready: ${ROWS} lines"
          elif [ "${ALLOW_SYNTHETIC}" = "true" ]; then
            echo "::warning::No data file. Synthetic mode explicitly enabled."
          else
            echo "::error::No market data and allow_synthetic=false."
            exit 1
          fi

      - name: Execute engine
        id: engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GITHUB_GIST_ID: ${{ secrets.GIST_ID }}
          ALLOW_SYNTHETIC: ${{ github.event.inputs.allow_synthetic || 'false' }}
          EXECUTION_MODE: ${{ github.event.inputs.execution_mode || 'research' }}
        run: |
          echo "Execution mode: ${EXECUTION_MODE}"
          if [ "${ALLOW_SYNTHETIC}" = "true" ]; then
            python xauusd_apex_v36.py --data data/xauusd_m5.csv --allow-synthetic
          else
            python xauusd_apex_v36.py --data data/xauusd_m5.csv
          fi

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-report-${{ github.run_id }}
          path: V36_QUANT_EXECUTION_REPORT.json
          retention-days: 90
          if-no-files-found: warn
