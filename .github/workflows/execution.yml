name: XAUUSD APEX V36

on:
  workflow_dispatch:
    inputs:
      allow_synthetic:
        description: 'Gunakan data sintetis?'
        type: choice
        options: ['false', 'true']
        default: 'false'
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  execute:
    name: V36 Quant Engine
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance

      - name: Download Real Data
        run: |
          python -c "
          import yfinance as yf
          import pandas as pd
          import os
          print('Mengunduh data XAUUSD...')
          data = yf.download('GC=F', period='5y', interval='1h')
          if data.empty: raise ValueError('Data kosong')
          if isinstance(data.columns, pd.MultiIndex): data.columns = data.columns.get_level_values(0)
          
          # Paksa semua nama kolom jadi huruf kecil
          data.columns = [str(c).lower() for c in data.columns]
          data = data.reset_index()
          data.columns = [str(c).lower() for c in data.columns]
          
          # Deteksi otomatis nama kolom waktu (Datetime, Date, atau Index)
          if 'datetime' in data.columns: data = data.rename(columns={'datetime': 'timestamp'})
          elif 'date' in data.columns: data = data.rename(columns={'date': 'timestamp'})
          elif 'index' in data.columns: data = data.rename(columns={'index': 'timestamp'})
          
          # Ambil kolom yang dibutuhkan
          data = data[['timestamp', 'open', 'high', 'low', 'close', 'volume']]
          data['timestamp'] = pd.to_datetime(data['timestamp'])
          if data['timestamp'].dt.tz is None:
              data['timestamp'] = data['timestamp'].dt.tz_localize('UTC')
          else:
              data['timestamp'] = data['timestamp'].dt.tz_convert('UTC')
              
          os.makedirs('data', exist_ok=True)
          data.to_csv('data/xauusd_m5.csv', index=False)
          print(f'BERHASIL: {len(data)} baris diunduh')
          "

      - name: Execute engine
        env:
          ALLOW_SYNTHETIC: ${{ github.event.inputs.allow_synthetic || 'false' }}
        run: |
          if [ "${ALLOW_SYNTHETIC}" = "true" ]; then
            python xauusd_apex_v36.py --data data/xauusd_m5.csv --allow-synthetic
          else
            python xauusd_apex_v36.py --data data/xauusd_m5.csv
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-report-${{ github.run_id }}
          path: V36_QUANT_EXECUTION_REPORT.json
          if-no-files-found: warn
