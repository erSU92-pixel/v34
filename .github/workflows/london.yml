import requests
BACKTEST_MODE: "1"

logging.basicConfig(level=logging.INFO,
    format="%(asctime)s | %(levelname)s | %(name)s | %(message)s")
logger = logging.getLogger("LONDON_BO")

# =============================================================================
# ENV
# =============================================================================
TWELVE_DATA_KEY = os.getenv("TWELVEDATA_API_KEY")
TELEGRAM_TOKEN  = os.getenv("TELEGRAM_TOKEN")
TELEGRAM_CHAT   = os.getenv("TELEGRAM_CHAT_ID")
GIST_ID         = os.getenv("GIST_ID")
GITHUB_TOKEN    = os.getenv("GITHUB_TOKEN")

SYMBOL         = os.getenv("SYMBOL", "XAU/USD")
INTERVAL       = "1h"
OUTPUT_SIZE    = int(os.getenv("OUTPUT_SIZE", "500"))
CONTRACT_SIZE  = 100
MIN_LOT        = 0.01
MAX_LOT        = 5.0

SERVER_TZ_OFFSET   = int(os.getenv("SERVER_TZ_OFFSET", "0"))
ASIA_START_UTC  = (int(os.getenv("ASIA_START_HOUR", "3")) - SERVER_TZ_OFFSET) % 24
ASIA_END_UTC    = (int(os.getenv("ASIA_END_HOUR", "8")) - SERVER_TZ_OFFSET) % 24
ENTRY_HOUR_UTC  = (int(os.getenv("ENTRY_HOUR", "8")) - SERVER_TZ_OFFSET) % 24
CLOSE_HOUR_UTC  = (int(os.getenv("CLOSE_HOUR", "21")) - SERVER_TZ_OFFSET) % 24

RANGE_MIN_PCT = float(os.getenv("RANGE_MIN_PCT", "0.0030"))
RANGE_MAX_PCT = float(os.getenv("RANGE_MAX_PCT", "0.0160"))
SL_MAX_PCT    = float(os.getenv("SL_MAX_PCT", "0.0060"))
TP_R          = float(os.getenv("TP_R", "2.5"))
BE_R          = float(os.getenv("BE_R", "1.5"))

ACCOUNT_BALANCE = float(os.getenv("ACCOUNT_BALANCE", "10000"))
RISK_PCT        = float(os.getenv("RISK_PCT", "0.003"))
MAX_DAILY_LOSS_PCT     = 0.02
MAX_DRAWDOWN_PCT       = 0.15
MAX_CONSECUTIVE_LOSSES = 4

# BACKTEST MODE — jalankan langsung pada data historis
BACKTEST_MODE = os.getenv("BACKTEST_MODE", "0") == "1"
BACKTEST_DAYS = int(os.getenv("BACKTEST_DAYS", "14"))

# =============================================================================
# HTTP
# =============================================================================
class ResilientSession:
    def __init__(self, min_interval_sec=7.5):
        self.session = requests.Session()
        self.min_interval = min_interval_sec
        self._last = 0.0
    def _throttle(self):
        elapsed = time.time() - self._last
        if elapsed < self.min_interval:
            time.sleep(self.min_interval - elapsed)
    def request(self, method, url, **kwargs):
        for attempt in range(5):
            self._throttle()
            try:
                r = self.session.request(method, url, timeout=30, **kwargs)
                self._last = time.time()
                if r.status_code == 429:
                    ra = int(r.headers.get("Retry-After", 2 ** attempt))
                    time.sleep(ra + np.random.uniform(0, 1)); continue
                if 500 <= r.status_code < 600:
                    time.sleep((2 ** attempt) + np.random.uniform(0, 1)); continue
                return r
            except requests.RequestException:
                time.sleep((2 ** attempt) + np.random.uniform(0, 1))
        raise RuntimeError(f"HTTP failed: {method} {url}")

http = ResilientSession()

# =============================================================================
# DATA
# =============================================================================
def fetch_ohlcv():
    url = "https://api.twelvedata.com/time_series"
    params = {"symbol": SYMBOL, "interval": INTERVAL, "outputsize": OUTPUT_SIZE,
              "apikey": TWELVE_DATA_KEY, "format": "JSON", "timezone": "UTC"}
    resp = http.request("GET", url, params=params)
    data = resp.json()
    if data.get("status") == "error":
        raise RuntimeError(f"TD: {data.get('message')}")
    values = data.get("values")
    if not values: raise RuntimeError("TD empty")
    df = pd.DataFrame(values)
    df["datetime"] = pd.to_datetime(df["datetime"], utc=True)
    df = df.set_index("datetime").sort_index()
    for col in ["open", "high", "low", "close", "volume"]:
        if col in df.columns:
            df[col] = pd.to_numeric(df[col], errors="coerce")
    df = df.dropna(subset=["open", "high", "low", "close"])
    now = pd.Timestamp.now(tz="UTC")
    df = df[df.index <= now].reset_index()
    logger.info("Fetched %d bars | %s → %s", len(df),
                df["datetime"].iloc[0], df["datetime"].iloc[-1])
    return df

# =============================================================================
# CORE LOGIC
# =============================================================================
def compute_asia_range(df, trade_date):
    today = df[df["datetime"].dt.date == trade_date]
    if len(today) == 0: return None
    m = (today["datetime"].dt.hour >= ASIA_START_UTC) & (today["datetime"].dt.hour < ASIA_END_UTC)
    asia = today[m]
    hours_needed = (ASIA_END_UTC - ASIA_START_UTC) % 24
    if len(asia) < max(3, hours_needed - 1): return None
    hi = float(asia["high"].max()); lo = float(asia["low"].min())
    cl = float(asia["close"].iloc[-1])
    rng = (hi - lo) / cl if cl > 0 else 0
    if rng < RANGE_MIN_PCT or rng > RANGE_MAX_PCT: return None
    return {"high": hi, "low": lo, "range_pct": rng, "bars": len(asia)}


def detect_breakout(df, trade_date, hi, lo):
    today = df[df["datetime"].dt.date == trade_date].sort_values("datetime")
    if len(today) == 0: return None
    after = today[today["datetime"].dt.hour >= ENTRY_HOUR_UTC]
    if len(after) == 0: return None
    for _, row in after.iterrows():
        c = float(row["close"])
        if c > hi: return {"direction": "BUY", "entry": c, "bar": row["datetime"]}
        if c < lo: return {"direction": "SELL", "entry": c, "bar": row["datetime"]}
    return None


def compute_sl_tp(direction, entry, hi, lo):
    raw = (entry - lo) if direction == "BUY" else (hi - entry)
    cap = entry * SL_MAX_PCT
    sl_dist = min(raw, cap)
    if sl_dist <= 0: sl_dist = entry * 0.001
    if direction == "BUY":
        return {"sl": entry - sl_dist, "tp": entry + TP_R * sl_dist,
                "be": entry + BE_R * sl_dist, "sl_pct": sl_dist / entry * 100}
    return {"sl": entry + sl_dist, "tp": entry - TP_R * sl_dist,
            "be": entry - BE_R * sl_dist, "sl_pct": sl_dist / entry * 100}


def simulate_outcome(df, trade_date, breakout, sltp):
    """Simulasi hasil trade pada data historis."""
    direction = breakout["direction"]; entry = breakout["entry"]
    sl = sltp["sl"]; tp = sltp["tp"]; be_trigger = sltp["be"]
    be_hit = False
    after = df[(df["datetime"] > breakout["bar"]) &
               (df["datetime"].dt.date == trade_date)].sort_values("datetime")
    for _, row in after.iterrows():
        h = float(row["high"]); l = float(row["low"]); bt = row["datetime"]

        if not be_hit:
            if (direction == "BUY" and h >= be_trigger) or \
               (direction == "SELL" and l <= be_trigger):
                be_hit = True; sl = entry

        sl_hit = (direction == "BUY" and l <= sl) or (direction == "SELL" and h >= sl)
        if sl_hit:
            return {"outcome": "BE" if be_hit and sl == entry else "SL",
                    "exit": sl, "be_hit": be_hit}

        tp_hit = (direction == "BUY" and h >= tp) or (direction == "SELL" and l <= tp)
        if tp_hit:
            return {"outcome": "TP", "exit": tp, "be_hit": be_hit}

        if bt.hour >= CLOSE_HOUR_UTC:
            return {"outcome": "TIMEOUT", "exit": float(row["close"]), "be_hit": be_hit}
    return None


def position_size(entry, sl, balance):
    risk = balance * RISK_PCT
    dist = abs(entry - sl)
    if dist <= 0: return 0.0
    per_lot = dist * CONTRACT_SIZE
    lot = math.floor((risk / per_lot) / MIN_LOT) * MIN_LOT
    return max(min(lot, MAX_LOT), 0.0)

# =============================================================================
# BACKTEST MODE
# =============================================================================
def backtest_recent(df, n_days=14):
    """Jalankan London BO pada N hari terakhir. Print summary."""
    logger.info("═══ BACKTEST MODE — %d hari terakhir ═══", n_days)
    all_dates = sorted(df["datetime"].dt.date.unique())
    recent = all_dates[-n_days:]

    trades = []
    balance = ACCOUNT_BALANCE

    logger.info("%-12s | %-5s | %-8s | %-6s | %-8s | %-5s | %s",
                "Date", "Dir", "Entry", "SL%", "Range%", "BE", "Outcome")
    logger.info("-" * 85)

    for d in recent:
        asia = compute_asia_range(df, d)
        if asia is None:
            logger.info("%-12s | SKIP (range filter)", d)
            continue
        br = detect_breakout(df, d, asia["high"], asia["low"])
        if br is None:
            logger.info("%-12s | SKIP (no breakout)", d)
            continue
        sltp = compute_sl_tp(br["direction"], br["entry"], asia["high"], asia["low"])
        outcome = simulate_outcome(df, d, br, sltp)
        if outcome is None:
            logger.info("%-12s | %-5s | %-8.2f | %-6.2f | %-8.3f | %-5s | OPEN",
                        d, br["direction"], br["entry"], sltp["sl_pct"],
                        asia["range_pct"] * 100, "no")
            continue

        lot = position_size(br["entry"], sltp["sl"], balance)
        pnl = ((outcome["exit"] - br["entry"]) if br["direction"] == "BUY"
               else (br["entry"] - outcome["exit"])) * lot * CONTRACT_SIZE
        balance += pnl
        be_hit = "yes" if outcome["be_hit"] else "no"

        logger.info("%-12s | %-5s | %-8.2f | %-6.2f | %-8.3f | %-5s | %s PnL=$%+.2f",
                    d, br["direction"], br["entry"], sltp["sl_pct"],
                    asia["range_pct"] * 100, be_hit, outcome["outcome"], pnl)

        trades.append({"date": str(d), "direction": br["direction"],
                       "outcome": outcome["outcome"], "pnl": pnl,
                       "range_pct": asia["range_pct"], "be_hit": outcome["be_hit"]})

    # Summary
    if not trades:
        logger.warning("No trades in %d days — range filter too strict or no breakout", n_days)
        return

    wins = [t for t in trades if t["pnl"] > 0]
    losses = [t for t in trades if t["pnl"] < 0]
    total_pnl = sum(t["pnl"] for t in trades)
    gross_win = sum(t["pnl"] for t in wins)
    gross_loss = abs(sum(t["pnl"] for t in losses))
    pf = gross_win / gross_loss if gross_loss > 0 else float('inf')

    tp_count = sum(1 for t in trades if t["outcome"] == "TP")
    sl_count = sum(1 for t in trades if t["outcome"] == "SL")
    be_count = sum(1 for t in trades if t["outcome"] == "BE")
    to_count = sum(1 for t in trades if t["outcome"] == "TIMEOUT")

    logger.info("-" * 85)
    logger.info("═══ SUMMARY ═══")
    logger.info("Total trades: %d | Win: %d | Loss: %d", len(trades), len(wins), len(losses))
    logger.info("Outcomes: TP=%d | SL=%d | BE=%d | TIMEOUT=%d", tp_count, sl_count, be_count, to_count)
    logger.info("Win rate: %.1f%%", 100 * len(wins) / len(trades))
    logger.info("Total PnL: $%+.2f | Balance: $%.2f → $%.2f",
                total_pnl, ACCOUNT_BALANCE, balance)
    logger.info("Profit Factor: %.2f", pf)
    logger.info("Avg win: $%+.2f | Avg loss: $%+.2f",
                gross_win / len(wins) if wins else 0,
                -gross_loss / len(losses) if losses else 0)

    # Kirim ke Telegram juga
    msg = (
        f"📊 <b>BACKTEST London BO — {n_days} hari</b>\n"
        f"━━━━━━━━━━━━━━━\n"
        f"Trades: {len(trades)} (TP={tp_count} SL={sl_count} BE={be_count} TO={to_count})\n"
        f"Win rate: {100*len(wins)/len(trades):.1f}%\n"
        f"Total PnL: <b>${total_pnl:+.2f}</b>\n"
        f"Balance: ${ACCOUNT_BALANCE:.2f} → ${balance:.2f}\n"
        f"Profit Factor: <b>{pf:.2f}</b>\n"
        f"Avg win: ${gross_win/len(wins) if wins else 0:+.2f}\n"
        f"Avg loss: ${-gross_loss/len(losses) if losses else 0:+.2f}"
    )
    send_tg(msg)

# =============================================================================
# STATE
# =============================================================================
def load_state():
    url = f"https://api.github.com/gists/{GIST_ID}"
    h = {"Authorization": f"token {GITHUB_TOKEN}", "Accept": "application/vnd.github+json"}
    try:
        r = http.request("GET", url, headers=h)
    except RuntimeError as e:
        logger.error("Gist GET exception: %s", e)
        return {"etag": None, "content": {}}
    if r.status_code != 200:
        logger.warning("Gist GET failed: %d — %s", r.status_code, r.text[:150])
        if r.status_code == 404:
            logger.error("→ Cek secret GIST_ID")
        elif r.status_code in (401, 403):
            logger.error("→ Cek GIST_TOKEN scope 'gist'")
        return {"etag": None, "content": {}}
    content = {}
    for name, f in r.json().get("files", {}).items():
        if name.endswith(".json"):
            try: content = json.loads(f.get("content", "{}")); break
            except: continue
    return {"etag": r.headers.get("ETag"), "content": content}


def save_state(state, etag):
    url = f"https://api.github.com/gists/{GIST_ID}"
    payload = {"files": {"london_state.json": {
        "content": json.dumps(state, indent=2, default=str)}}}
    h = {"Authorization": f"token {GITHUB_TOKEN}", "Accept": "application/vnd.github+json"}
    if etag: h["If-Match"] = etag
    try:
        r = http.request("PATCH", url, headers=h, json=payload)
    except RuntimeError as e:
        logger.error("Gist PATCH exc: %s", e); return False
    if r.status_code in (200, 201):
        logger.info("Gist saved OK"); return True
    if r.status_code == 412:
        h.pop("If-Match", None)
        try:
            r = http.request("PATCH", url, headers=h, json=payload)
        except RuntimeError: return False
        if r.status_code in (200, 201):
            logger.info("Gist saved (no If-Match)"); return True
    logger.error("Gist PATCH failed: %d — %s", r.status_code, r.text[:200])
    return False

# =============================================================================
# TELEGRAM
# =============================================================================
def send_tg(msg):
    if not TELEGRAM_TOKEN or not TELEGRAM_CHAT: return False
    url = f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage"
    payload = {"chat_id": TELEGRAM_CHAT, "text": msg, "parse_mode": "HTML"}
    for a in range(3):
        try: r = http.request("POST", url, json=payload)
        except RuntimeError: return False
        if r.status_code == 200: return True
        if r.status_code == 429:
            try: ra = int(r.json().get("parameters", {}).get("retry_after", 5))
            except: ra = 5
            time.sleep(ra + 1); continue
        time.sleep(2 ** a)
    return False

# =============================================================================
# CIRCUIT BREAKER + LIVE TRADE MONITOR
# =============================================================================
def check_cb(state):
    bal = state.get("balance", ACCOUNT_BALANCE)
    peak = state.get("peak_equity", bal)
    daily = state.get("daily_pnl", 0.0)
    consec = state.get("consecutive_losses", 0)
    if state.get("halted", False): return True
    peak = max(peak, bal); state["peak_equity"] = peak
    dd = (peak - bal) / max(peak, 1e-9)
    dl = -daily / bal if daily < 0 else 0.0
    if dd >= MAX_DRAWDOWN_PCT:
        logger.critical("CB DD %.2f%%", dd * 100); state["halted"] = True; return True
    if dl >= MAX_DAILY_LOSS_PCT:
        logger.critical("CB daily %.2f%%", dl * 100); state["halted"] = True; return True
    if consec >= MAX_CONSECUTIVE_LOSSES:
        logger.critical("CB consec %d", consec); state["halted"] = True; return True
    return False


def check_trade_outcome(df, trade):
    direction = trade["direction"]; entry = trade["entry"]
    sl = trade["sl"]; tp = trade["tp"]; be_trigger = trade["be_trigger"]
    be_hit = trade.get("be_hit", False)
    opened = pd.Timestamp(trade["opened_at"])
    after = df[df["datetime"] > opened].sort_values("datetime")
    for _, row in after.iterrows():
        h = float(row["high"]); l = float(row["low"]); bt = row["datetime"]
        if not be_hit:
            if (direction == "BUY" and h >= be_trigger) or \
               (direction == "SELL" and l <= be_trigger):
                be_hit = True; sl = entry
        sl_hit = (direction == "BUY" and l <= sl) or (direction == "SELL" and h >= sl)
        if sl_hit:
            return {"outcome": "BE" if be_hit and sl == entry else "SL",
                    "exit_price": sl, "be_hit": be_hit}
        tp_hit = (direction == "BUY" and h >= tp) or (direction == "SELL" and l <= tp)
        if tp_hit:
            return {"outcome": "TP", "exit_price": tp, "be_hit": be_hit}
        if bt.hour >= CLOSE_HOUR_UTC:
            return {"outcome": "TIMEOUT", "exit_price": float(row["close"]), "be_hit": be_hit}
    return None

# =============================================================================
# MAIN
# =============================================================================
def main():
    logger.info("═══ LONDON BO v1.2 | %s | BACKTEST_MODE=%s ═══", SYMBOL, BACKTEST_MODE)

    # === BACKTEST MODE — langsung jalan, tanpa nunggu jam ===
    if BACKTEST_MODE:
        try:
            df = fetch_ohlcv()
        except Exception as e:
            logger.error("Data failed: %s", e); return
        backtest_recent(df, BACKTEST_DAYS)
        return

    # === LIVE MODE ===
    missing = [n for n, v in [
        ("TWELVEDATA_API_KEY", TWELVE_DATA_KEY),
        ("TELEGRAM_TOKEN", TELEGRAM_TOKEN),
        ("TELEGRAM_CHAT_ID", TELEGRAM_CHAT),
        ("GIST_ID", GIST_ID), ("GITHUB_TOKEN", GITHUB_TOKEN),
    ] if not v]
    if missing:
        logger.error("Env missing: %s", missing); return

    s = load_state()
    state = s["content"] or {}
    state.setdefault("balance", ACCOUNT_BALANCE)
    state.setdefault("peak_equity", ACCOUNT_BALANCE)
    state.setdefault("daily_pnl", 0.0)
    state.setdefault("consecutive_losses", 0)
    state.setdefault("halted", False)
    state.setdefault("active_trade", None)

    if check_cb(state):
        send_tg("🚨 CIRCUIT BREAKER"); return

    try:
        df = fetch_ohlcv()
    except Exception as e:
        logger.error("Data failed: %s", e); send_tg(f"⚠️ {e}"); return

    now = datetime.now(timezone.utc)
    today = now.date(); today_str = str(today)

    # ==== Monitor existing trade ====
    trade = state.get("active_trade")
    if trade:
        if trade.get("trade_date") != today_str:
            logger.info("Close stale trade")
            state["active_trade"] = None
        else:
            outcome = check_trade_outcome(df, trade)
            if outcome:
                entry = trade["entry"]; exit_px = outcome["exit_price"]
                lot = trade.get("lot", 0.01)
                pnl = ((exit_px - entry) if trade["direction"] == "BUY"
                       else (entry - exit_px)) * lot * CONTRACT_SIZE
                state["balance"] = state.get("balance", ACCOUNT_BALANCE) + pnl
                if outcome["outcome"] == "SL":
                    state["consecutive_losses"] = state.get("consecutive_losses", 0) + 1
                elif outcome["outcome"] == "TP":
                    state["consecutive_losses"] = 0
                send_tg(
                    f"{'✅' if outcome['outcome']=='TP' else '❌' if outcome['outcome']=='SL' else '⏰'} "
                    f"<b>{outcome['outcome']}</b> {trade['direction']}\n"
                    f"PnL ${pnl:+.2f} | Balance ${state['balance']:.2f}")
                state["active_trade"] = None
            else:
                logger.info("Trade active: %s @ %.2f", trade["direction"], trade["entry"])

    # ==== Signal detection ====
    if state.get("active_trade") is None:
        asia = compute_asia_range(df, today)
        if asia:
            br = detect_breakout(df, today, asia["high"], asia["low"])
            if br:
                # Idempotent: only if breakout bar = last closed bar
                last_closed = df.iloc[-1]
                if br["bar"] != last_closed["datetime"]:
                    logger.info("Breakout old (%s), skip", br["bar"])
                else:
                    sltp = compute_sl_tp(br["direction"], br["entry"],
                                          asia["high"], asia["low"])
                    lot = position_size(br["entry"], sltp["sl"], state["balance"])
                    if lot >= MIN_LOT:
                        state["active_trade"] = {
                            "direction": br["direction"], "entry": br["entry"],
                            "sl": sltp["sl"], "tp": sltp["tp"],
                            "be_trigger": sltp["be"], "be_hit": False,
                            "lot": lot, "opened_at": str(now),
                            "trade_date": today_str}
                        emoji = "🟢" if br["direction"] == "BUY" else "🔴"
                        send_tg(
                            f"{emoji} <b>{br['direction']}</b> XAUUSD\n"
                            f"Entry {br['entry']:.2f} | SL {sltp['sl']:.2f} ({sltp['sl_pct']:.2f}%)\n"
                            f"TP {sltp['tp']:.2f} | BE {sltp['be']:.2f} | Lot {lot}")

    state["last_update"] = now.isoformat()
    for _ in range(2):
        if save_state(state, s.get("etag")): break
        s = load_state()

    logger.info("═══ COMPLETE ═══")


if __name__ == "__main__":
    main()
