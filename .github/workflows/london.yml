name: XAUUSD London Breakout

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      backtest_mode:
        description: "1=backtest historis, 0=live"
        required: false
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
      backtest_days:
        description: "Jumlah hari backtest"
        required: false
        default: "14"

concurrency:
  group: london-bo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run London Breakout
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}

          SYMBOL: "XAU/USD"
          ACCOUNT_BALANCE: "10000"
          RISK_PCT: "0.003"

          SERVER_TZ_OFFSET: "0"
          ASIA_START_HOUR: "3"
          ASIA_END_HOUR: "8"
          ENTRY_HOUR: "8"
          CLOSE_HOUR: "21"

          RANGE_MIN_PCT: "0.0030"
          RANGE_MAX_PCT: "0.0160"
          SL_MAX_PCT: "0.0060"
          TP_R: "2.5"
          BE_R: "1.5"

          # Saat manual trigger: ambil input (default 1 = backtest)
          # Saat cron otomatis: default 0 = live
          BACKTEST_MODE: ${{ github.event.inputs.backtest_mode || '0' }}
          BACKTEST_DAYS: ${{ github.event.inputs.backtest_days || '14' }}

          NOTIFY_HOLD: "0"
        run: python london_breakout.py
