name: XAUUSD Signal Bot v7

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: xauusd-signal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            data/quant_audit.db
            data/news_cache.json
          key: bot-cache-${{ github.run_id }}
          restore-keys: bot-cache-

      - name: Run signal bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          ACCOUNT_SIZE_USD:    ${{ vars.ACCOUNT_SIZE_USD || '10000' }}
          RISK_PCT:            ${{ vars.RISK_PCT || '1.0' }}
          KELLY_FRACTION:      ${{ vars.KELLY_FRACTION || '0.5' }}
          KELLY_CAP_PCT:       ${{ vars.KELLY_CAP_PCT || '3.0' }}
        run: python bot.py

      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/quant_audit.db
            data/news_cache.json
          key: bot-cache-${{ github.run_id }}
