name: XAUUSD APEX V38 LIVE

on:
  schedule:
    # Setiap 15 menit — minimum praktis GitHub Actions.
    # Guard: skip jika market tutup / bar belum ganti / signal sudah diproses.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Trading mode'
        type: choice
        options:
          - paper
          - oanda-practice
          - oanda-live
        default: 'paper'
      dry_run:
        description: 'Dry run (no orders, hanya cek state & data)?'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'
      force_reset_kill:
        description: 'Reset kill switch? (HANYA untuk recovery manual)'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

permissions:
  contents: read

concurrency:
  group: v38-live-${{ github.ref }}
  cancel-in-progress: false   # JANGAN batalkan: bisa memutus order di tengah jalan

jobs:
  execute:
    name: V38 Live Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # --- Mode & safety ---
      TRADING_MODE: ${{ github.event.inputs.mode || 'paper' }}
      CONFIRM_LIVE: ${{ secrets.CONFIRM_LIVE }}
      FORCE_RESET_KILL: ${{ github.event.inputs.force_reset_kill || 'false' }}

      # --- Broker (OANDA) ---
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      SYMBOL: 'XAU_USD'

      # --- Alerts ---
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # --- State persistence ---
      GIST_ID: ${{ secrets.GIST_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_FILENAME: 'xauusd_v38_state.json'
      LOCAL_STATE: 'state/xauusd_v38_state.json'

      # --- Risk params (override default script) ---
      MAX_RISK_PER_TRADE: '0.01'
      MAX_POSITION_FRAC: '0.5'
      MAX_DRAWDOWN_KILL: '0.10'
      MAX_DAILY_LOSS_KILL: '0.03'
      MAX_CONSECUTIVE_LOSSES: '5'
      MIN_CONFIDENCE: '0.55'
      EQUITY_START: '100000'

      # --- Guards ---
      MAX_SPREAD_USD: '1.00'
      MAX_HEARTBEAT_AGE_SEC: '7200'
      ORPHAN_ACTION: 'halt'
      MAX_LIVE_STALENESS_HOURS: '4'

      # --- ML ---
      N_STRATEGY_TRIALS: '1'
      MIN_DATA_BARS: '2000'
      BARS_FOR_TRAIN: '5000'

      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: |
          python - <<'PYEOF'
          import sklearn, scipy, requests, pandas, numpy
          print("core imports OK")
          PYEOF

      - name: Pre-flight guard (live mode needs explicit confirmation)
        if: github.event.inputs.mode == 'oanda-live'
        run: |
          if [ "${CONFIRM_LIVE}" != "I_UNDERSTAND_THE_RISK" ]; then
            echo "::error::Mode oanda-live membutuhkan secret CONFIRM_LIVE=I_UNDERSTAND_THE_RISK"
            exit 1
          fi
          echo "Live mode confirmed."

      - name: Execute engine
        id: engine
        run: |
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          python xauusd_apex_v38_live.py ${ARGS}
        # exit code 0 = sukses (order atau skip normal)
        # exit code 1 = error fatal (data, order, reconcile)

      - name: Upload state snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v38-state-${{ github.run_id }}
          path: state/xauusd_v38_state.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v38-logs-${{ github.run_id }}
          path: |
            *.log
            logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "${TELEGRAM_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="⚠️ V38 ENGINE FAILED on run ${{ github.run_id }} (mode: ${{ github.event.inputs.mode || 'paper' }}). Cek Actions log." \
              || true
          fi
